controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    odom_topic: /odometry/filtered
    costmap_update_timeout: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.20
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: -0.40
      min_vel_y: -0.40
      max_vel_x: 0.40
      max_vel_y: 0.40
      max_vel_theta: 0.80
      min_speed_xy: 0.0
      max_speed_xy: 0.40
      min_speed_theta: 0.0
      acc_lim_x: 0.80
      acc_lim_y: 0.80
      acc_lim_theta: 1.50
      decel_lim_x: -0.80
      decel_lim_y: -0.80
      decel_lim_theta: -1.50
      vx_samples: 15
      vy_samples: 15
      vtheta_samples: 20
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 5.0
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        - RotateToGoal
        - Oscillation
        - ObstacleFootprint
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.20
      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.20
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      # Allow the EKF time to begin publishing odom -> base_link at startup.
      transform_tolerance: 10.0
      rolling_window: true
      width: 7
      height: 7
      resolution: 0.05
      footprint: "[[0.40, 0.50], [0.40, -0.50], [-0.40, -0.50], [-0.40, 0.50]]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: front_depth
        front_depth:
          topic: /front/depth/points
          data_type: "PointCloud2"
          clearing: true
          marking: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.00
          obstacle_min_range: 0.10
          obstacle_max_range: 3.00
          raytrace_min_range: 0.10
          raytrace_max_range: 3.50

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.75
        cost_scaling_factor: 3.0

      always_send_full_costmap: true
