controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    odom_topic: /odometry/filtered
    costmap_update_timeout: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      # Count in-place rotation as progress while aligning to the goal yaw.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.05
      required_movement_angle: 0.05
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Latch the position check once it is satisfied. Requiring 0.04 m and
      # 0.04 rad to hold on the *same* 50 ms cycle is not achievable for a
      # stochastic optimizer on a base that overruns its commands, so the run
      # never terminated and the robot kept nudging at the wall.
      stateful: true
      # Do not report success while the base is still almost a metre from the
      # required path endpoint.
      xy_goal_tolerance: 0.04
      yaw_goal_tolerance: 0.04

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1
      # Keep rollouts close to the current command. Large velocity perturbations
      # make consecutive MPPI cycles choose alternating lateral corrections.
      # Scaled with the speed limits below so the samples do not spend most of
      # their range clipped against them.
      vx_std: 0.15
      vy_std: 0.15
      wz_std: 0.10
      # Symmetric omnidirectional speed and acceleration limits, held well below
      # what the drivetrain will actually deliver. The MJCF wheels roll on a
      # 0.15 m effective radius against the 0.12 m declared in controllers.yaml,
      # so true ground speed is ~1.25x the command and wheel odometry does not
      # report the difference.
      #
      # Sized against the tightest stop in the arena. The hole poses put the
      # base 0.75 m from the wall at x=+/-2.45..2.50, leaving the padded
      # footprint 0.23 m of travel. At 0.60 the real speed is 0.75 m/s, and
      # worst-case braking (1.0 m/s^2 measured) plus ~0.1 s of command latency
      # needs 0.36 m -- more than the whole corridor. 0.45 needs 0.21 m.
      vx_max: 0.45
      vx_min: -0.45
      vy_max: 0.45
      wz_max: 1.20
      # An honest deceleration model. The base measures ~1.0-1.6 m/s^2 of real
      # deceleration, so claiming 2.5 made MPPI plan stops the robot could not
      # make and enter the approach to an obstacle still carrying speed. Take
      # the low end of that measured range rather than the middle: planning
      # against the weakest braking the base actually delivers makes the
      # optimizer start slowing sooner, and the smoother is still free to brake
      # harder (-2.50) than this if a command demands it.
      ax_max: 1.20
      ax_min: -1.00
      ay_max: 1.20
      ay_min: -1.00
      az_max: 2.00
      # The rollout horizon is 56 * 0.05 s = 2.8 s, about 1.26 m at vx_max.
      # Feed the critics at least that much path, or the trajectories run past
      # the end of the reference they are scored against.
      prune_distance: 1.50
      # Bound closest-point searches to the local portion of a detour so a
      # later segment across an obstacle cannot become the tracking target.
      max_robot_pose_search_dist: 1.00
      transform_tolerance: 5.0
      # Blend several low-cost rollouts instead of abruptly switching to a
      # different single winner at each controller cycle.
      temperature: 0.20
      # Reduce the control-effort penalty so faster valid trajectories win.
      gamma: 0.003
      motion_model: "Omni"
      visualize: false
      # Reusing the sample set avoids cycle-to-cycle command jitter.
      regenerate_noises: false
      critics:
        - ConstraintCritic
        - ObstaclesCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - TwirlingCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        # Unlike CostCritic's sampled inflated-cell cost, this critic explicitly
        # balances obstacle distance against path alignment and performs exact
        # footprint collision checks near obstacles.
        # Weighted against GoalCritic (30) and PathFollowCritic (50): the
        # repulsion term is averaged over the trajectory, so at 2.5 it moved
        # the total cost by well under one unit and never influenced which
        # rollout won.
        repulsion_weight: 300.0
        critical_weight: 200.0
        consider_footprint: true
        collision_cost: 1000000.0
        # Match physical padding (0.02 m) plus this margin to the collision
        # monitor's 0.22 m hard-stop reserve.
        # Cannot be raised: the hole poses park the footprint 0.23 m from the
        # wall, so a wider severe-penalty band would price the goal itself out.
        collision_margin_distance: 0.30
        # Obstacle repulsion is suppressed within this radius of the goal so it
        # cannot fight goal convergence. At 1.0 m that covered the whole final
        # approach to a hole -- the robot closed the last metre onto a wall
        # with no repulsive gradient at all, which is the segment where it ran
        # in. Keep it just outside the goal tolerance instead.
        near_goal_distance: 0.25
      GoalCritic:
        enabled: true
        cost_power: 1
        # Apply the same strong goal-progress incentive along the whole arena,
        # rather than only after the remaining path is 1.5 m or shorter.
        cost_weight: 30.0
        threshold_to_consider: 10.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        # Do not spend most of the route rotating toward the final yaw. Align
        # during the final approach, after translation has done useful work.
        cost_weight: 30.0
        threshold_to_consider: 2.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        # The global planner replans around dynamic obstacles at 2 Hz, so MPPI
        # should closely execute that collision-free path rather than disable
        # alignment and independently cut across its obstacle-side corner.
        cost_weight: 20.0
        max_path_occupancy_ratio: 1.0
        trajectory_point_step: 1
        # Keep path alignment active through goal acceptance (0.15 m) so the
        # optimizer does not briefly reverse an axis at a critic handoff.
        threshold_to_consider: 0.10
        offset_from_furthest: 4
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        # Track the next path point. Looking several points ahead lets an omni
        # base alternate between lateral shortcut candidates at each cycle.
        cost_weight: 50.0
        offset_from_furthest: 1
        threshold_to_consider: 0.6
      TwirlingCritic:
        enabled: true
        cost_power: 1
        # An omni base can strafe along the route; avoid a speculative turn
        # that must later be undone for the goal yaw.
        cost_weight: 20.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      # Allow the EKF time to begin publishing odom -> base_link at startup.
      transform_tolerance: 10.0
      rolling_window: true
      width: 7
      height: 7
      resolution: 0.05
      footprint: "[[0.50, 0.40], [0.50, -0.40], [-0.50, -0.40], [-0.50, 0.40]]"
      # Keep only a small numerical allowance as a hard collision boundary.
      # ObstaclesCritic applies the larger 0.20 m clearance as a soft penalty,
      # so the controller can still generate an escape command near obstacles.
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]

      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/keepout_costmap_filter_info"

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # Scans can arrive a few tens of milliseconds ahead of the latest EKF
        # transform in simulation. Keep them queued until that transform lands.
        tf_filter_tolerance: 0.20
        # Lidar self-returns are filtered by MuJoCo geom groups. Keeping
        # footprint clearing enabled here would erase a real obstacle as soon
        # as any part of it enters the footprint, letting the robot tunnel
        # through a dragged box.
        footprint_clearing_enabled: false
        observation_sources: front_lidar back_lidar front_depth
        front_lidar:
          topic: /front_scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          # Observation-source height defaults reject the z=0.20 m scan unless
          # these bounds are stated explicitly.
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.05
          obstacle_max_range: 10.0
          raytrace_min_range: 0.05
          raytrace_max_range: 12.0
        back_lidar:
          topic: /back_scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.05
          obstacle_max_range: 10.0
          raytrace_min_range: 0.05
          raytrace_max_range: 12.0
        front_depth:
          topic: /front_camera/points
          data_type: "PointCloud2"
          clearing: true
          marking: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.00
          obstacle_min_range: 0.10
          obstacle_max_range: 3.00
          raytrace_min_range: 0.10
          raytrace_max_range: 3.50

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Global planning remains deliberately conservative (1.00 m / 2.0).
        # The local layer only needs to collision-check and track that route.
        inflation_radius: 0.75
        cost_scaling_factor: 3.0

      always_send_full_costmap: true
