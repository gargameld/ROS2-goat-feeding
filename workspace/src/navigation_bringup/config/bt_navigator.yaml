bt_navigator:
  ros__parameters:
    use_sim_time: true
    # Standard Nav2 tree tick: react promptly to controller completion and updates.
    bt_loop_duration: 10

    # Expose only the NavigateToPose action server.
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

behavior_server:
  ros__parameters:
    use_sim_time: true
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors::Wait"
