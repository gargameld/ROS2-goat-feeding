planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    costmap_update_timeout: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      # Do not substitute a nearby reachable endpoint for the requested goal.
      # If the requested goal cell is unreachable, planning must fail.
      tolerance: 0.0
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.30
        w_data: 0.20
        tolerance: 1.0e-10
        do_refinement: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 10.0
      resolution: 0.05
      track_unknown_space: true
      # The collision monitor's hard-stop rectangle is +/-0.72 x +/-0.62 m.
      # Its circumscribed radius is 0.950 m. Planning with that circle makes
      # every accepted path executable without entering StopZone, regardless
      # of the chassis orientation chosen independently by the omni controller.
      robot_radius: 0.4
      footprint_padding: 0.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        tf_filter_tolerance: 0.20
        # Self-returns are filtered at the simulator lidar, so preserve real
        # obstacle endpoints even when they overlap the robot footprint.
        footprint_clearing_enabled: false
        observation_sources: front_lidar back_lidar front_depth
        front_lidar:
          topic: /front_scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.05
          obstacle_max_range: 10.0
          raytrace_min_range: 0.05
          raytrace_max_range: 12.0
        back_lidar:
          topic: /back_scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.05
          obstacle_max_range: 10.0
          raytrace_min_range: 0.05
          raytrace_max_range: 12.0
        front_depth:
          topic: /front_camera/points
          data_type: "PointCloud2"
          clearing: true
          marking: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.00
          obstacle_min_range: 0.10
          obstacle_max_range: 3.00
          raytrace_min_range: 0.10
          raytrace_max_range: 3.50

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.25
        cost_scaling_factor: 2.0

      always_send_full_costmap: true
