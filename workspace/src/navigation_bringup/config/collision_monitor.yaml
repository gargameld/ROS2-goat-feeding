collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true

    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /mecanum_drive_controller/reference
    state_topic: /collision_monitor/state

    transform_tolerance: 1.0
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0

    # Velocity-aware protection only. A static stop/slow zone triggers on
    # distance alone, so it halts a slow, deliberate creep toward a wall just
    # as hard as a fast charge. The approach model instead takes the polygon
    # as the robot footprint and projects it forward along the *commanded*
    # velocity: at low speed the projection barely advances, so creeping close
    # is allowed; at speed the footprint reaches the obstacle within the time
    # horizon and the monitor stops the base. There is no static distance
    # floor by design -- collision safety here is purely time-to-collision.
    polygons: ["ApproachZone"]
    ApproachZone:
      type: polygon
      action_type: approach
      # The robot footprint that gets swept forward. Matches the physical
      # extent (x +/-0.50 m, y +/-0.40 m) plus a 0.02 m numerical margin, the
      # same padding the controller's footprint checker uses.
      points: "[[0.52, 0.42], [0.52, -0.42], [-0.52, -0.42], [-0.52, 0.42]]"
      # Look this many seconds ahead along the current velocity. Worst-case
      # braking from the 1.50 m/s axis limit at the 2.50 m/s^2 decel limit
      # takes ~0.6 s / ~0.45 m; 1.2 s leaves comfortable margin for command
      # latency and the source timeout while still permitting a slow approach.
      time_before_collision: 1.2
      # Granularity of the forward projection sweep.
      simulation_time_step: 0.1
      min_points: 3
      visualize: true
      polygon_pub_topic: /collision_monitor/approach_zone
      enabled: true

    observation_sources: ["front_scan", "back_scan"]
    front_scan:
      type: scan
      topic: /front_scan
      enabled: true
    back_scan:
      type: scan
      topic: /back_scan
      enabled: true
