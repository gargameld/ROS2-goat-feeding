      parking_3_side_2: [2.75, -3.7, 0.5, 0.7, 0.2, 1.1]
      parking_3_back: [3.0, -3.0, 0.5, 0.2, 1.5, 1.1]
      parking_3_entry_1: [2.5, -3.85, 0.5, 0.2, 0.4, 1.1]
      parking_3_entry_2: [2.5, -2.15, 0.5, 0.2, 0.4, 1.1]
      parking_3_shelf: [2.75, -3.0, 0.275, 0.5, 1.6, 0.05]
