      parking_2_side_2: [2.75, -5.7, 0.5, 0.7, 0.2, 1.1]
      parking_2_back: [3.0, -5.0, 0.5, 0.2, 1.5, 1.1]
      parking_2_entry_1: [2.5, -5.85, 0.5, 0.2, 0.4, 1.1]
      parking_2_entry_2: [2.5, -4.15, 0.5, 0.2, 0.4, 1.1]
      parking_2_shelf: [2.75, -5.0, 0.275, 0.5, 1.6, 0.05]
      parking_2_shelf_ceiling: [2.7, -5.0, 0.975, 0.6, 1.7, 0.15]
