sensors:
  - front_camera
  - left_camera
  - left_front_camera
  - left_back_camera

front_camera:
  filtered_cloud_topic: /front_camera/filtered_points
  max_range: 3.0
  max_update_rate: 1
  padding_offset: 0.02
  padding_scale: 1.0
  point_cloud_topic: /front_camera/points
  point_subsample: 1
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater

left_camera:
  filtered_cloud_topic: /left_camera/filtered_points
  max_range: 3.0
  max_update_rate: 1
  padding_offset: 0.02
  padding_scale: 1.0
