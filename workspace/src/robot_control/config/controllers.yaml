controller_manager:
  ros__parameters:
    use_sim_time: true
    required_active_controllers:
      - joint_state_broadcaster
      - imu_sensor_broadcaster
      - mecanum_drive_controller
      - arm_trajectory_controller
      - gripper_controller

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

mecanum_drive_controller:
  ros__parameters:
    use_sim_time: true
    reference_timeout: 0.2
    # Use the MJCF joint names at their corresponding controller corners.
    # Command and state mappings must remain identical for valid odometry.
    front_left_wheel_command_joint_name: fl_wheel_joint
    front_right_wheel_command_joint_name: fr_wheel_joint
    rear_left_wheel_command_joint_name: rl_wheel_joint
    rear_right_wheel_command_joint_name: rr_wheel_joint

    front_left_wheel_state_joint_name: fl_wheel_joint
    front_right_wheel_state_joint_name: fr_wheel_joint
    rear_left_wheel_state_joint_name: rl_wheel_joint
    rear_right_wheel_state_joint_name: rr_wheel_joint
    kinematics:
      wheels_radius: 0.12
      sum_of_robot_center_projection_on_X_Y_axis: 0.60
    base_frame_id: base_link
    odom_frame_id: odom
    # The EKF owns the odom -> base_link transform.
    enable_odom_tf: false

arm_trajectory_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - arm_shoulder_pan_joint
      - arm_shoulder_lift_joint
      - arm_elbow_joint
      - arm_wrist_1_joint
      - arm_wrist_2_joint
      - arm_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # Default FollowJointTrajectory action tolerances (radians and seconds).
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 4.0
      arm_shoulder_pan_joint:
        trajectory: 0.1
        goal: 0.01
      arm_shoulder_lift_joint:
        trajectory: 0.1
        goal: 0.01
      arm_elbow_joint:
        trajectory: 0.1
        goal: 0.01
      arm_wrist_1_joint:
        trajectory: 0.1
        goal: 0.01
      arm_wrist_2_joint:
        trajectory: 0.1
        goal: 0.01
      arm_wrist_3_joint:
        trajectory: 0.1
        goal: 0.01


gripper_controller:
  ros__parameters:
    use_sim_time: true
    joint: finger_joint
    allow_stalling: true

imu_sensor_broadcaster:
  ros__parameters:
    use_sim_time: true
    sensor_name: imu_sensor
    frame_id: base_link

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
