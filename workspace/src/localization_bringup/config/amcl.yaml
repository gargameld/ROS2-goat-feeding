amcl:
  ros__parameters:
    use_sim_time: true

    # TF frames published by the existing mecanum controller and robot model.
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    tf_broadcast: true
    transform_tolerance: 0.5

    # The platform is holonomic, so AMCL must use the omni motion model.
    robot_model_type: nav2_amcl::OmniMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 20.0
    laser_min_range: 0.05
    max_beams: 120
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2

    update_min_a: 0.10
    update_min_d: 0.10
    save_pose_rate: 0.5
    first_map_only: false
    always_reset_initial_pose: false
    set_initial_pose: true

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
