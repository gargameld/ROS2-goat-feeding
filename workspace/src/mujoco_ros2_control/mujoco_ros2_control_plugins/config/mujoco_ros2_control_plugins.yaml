/**:
  ros__parameters:
    mujoco_plugins:
      # Publishes every mujoco.plugin.lidar sensor. Single-row sensors use
      # sensor_msgs/LaserScan; multi-row sensors use sensor_msgs/PointCloud2.
      # Per-sensor frame_name/topic overrides may be nested here using the
      # MJCF sensor name as the key.
      mujoco_3d_lidar_plugin:
        type: "mujoco_ros2_control_plugins/Mujoco3dLidarPlugin"
        front_lidar:
          frame_name: "front_lidar_frame"
          topic: "/front_scan"
        back_lidar:
          frame_name: "back_lidar_frame"
          topic: "/back_scan"
      state_capture:
        type: "mujoco_ros2_control_plugins/StateCapturePlugin"
        capture_rate: 30.0
        flush_interval: 4.0
        buffer_capacity: 4096
        output_directory: "/config/workspace/capture"
        output_file: "simulation_states.csv"
      simulation_management:
        type: "mujoco_ros2_control_plugins/SimulationManagementPlugin"
        # Constant world-frame z height (metres) that thrown food is placed at.
        throw_food_height: 0.5
        # Number of parking areas addressable by the throw_food service (1..N).
        parking_count: 4
      lock_robot_base:
        type: "mujoco_ros2_control_plugins/LockRobotBasePlugin"
        # Name of the MJCF body carrying the base free joint that lock_base pins.
        body_name: "chassis"
