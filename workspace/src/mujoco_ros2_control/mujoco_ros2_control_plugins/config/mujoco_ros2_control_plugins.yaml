/**:
  ros__parameters:
    mujoco_plugins:
      # Publishes every mujoco.plugin.lidar sensor. Single-row sensors use
      # sensor_msgs/LaserScan; multi-row sensors use sensor_msgs/PointCloud2.
      # Per-sensor frame_name/topic overrides may be nested here using the
      # MJCF sensor name as the key.
      mujoco_3d_lidar_plugin:
        type: "mujoco_ros2_control_plugins/Mujoco3dLidarPlugin"
        front_lidar:
          frame_name: "front_lidar_frame"
          topic: "/front_scan"
        back_lidar:
          frame_name: "back_lidar_frame"
          topic: "/back_scan"
      state_capture:
        type: "mujoco_ros2_control_plugins/StateCapturePlugin"
        capture_rate: 30.0
        flush_interval: 4.0
        buffer_capacity: 4096
        output_directory: "/config/workspace/capture"
        output_file: "simulation_states.csv"
      obstacle_control:
        type: "mujoco_ros2_control_plugins/ObstacleControlPlugin"
        body_name: "obstacle"
        initial_position: [-2.0, -7.5, 0.5]
      simulation_state_provider:
        type: "mujoco_ros2_control_plugins/SimulationStateProviderPlugin"
        obstacle_geom_name: "obstacle"
      food_control:
        type: "mujoco_ros2_control_plugins/FoodControlPlugin"
        # Constant world-frame z height (metres) that thrown food is placed at.
        throw_food_height: 0.5
        # Number of parking areas addressable by the throw_food service (1..N).
        parking_count: 4
        # Each map-aligned parking frame has a map-frame XY origin and an
        # inclusive allowed XY range expressed in that parking frame.
        parking_frames:
          parking_1:
            offset: [2.6, -7.0]
            min_x: 0.0
            max_x: 0.3
            min_y: -0.2
            max_y: 0.2
          parking_2:
            offset: [2.6, -5.0]
            min_x: 0.0
            max_x: 0.3
            min_y: -0.2
            max_y: 0.2
          parking_3:
            offset: [2.6, -3.0]
            min_x: 0.0
            max_x: 0.3
            min_y: -0.2
            max_y: 0.2
          parking_4:
            offset: [2.6, -1.0]
            min_x: 0.0
            max_x: 0.3
            min_y: -0.2
            max_y: 0.2
      lock_robot_base:
        type: "mujoco_ros2_control_plugins/LockRobotBasePlugin"
        # Name of the MJCF body carrying the base free joint that lock_base pins.
        body_name: "chassis"
