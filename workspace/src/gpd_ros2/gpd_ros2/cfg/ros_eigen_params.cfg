# Path to config file for robot hand geometry
hand_geometry_filename = 0
#hand_geometry_filename = /home/rohit/workspace/ros1/2025_humanoids_ws/src/gpd/cfg/hand_geometry.cfg

# Path to config file for volume and image geometry
image_geometry_filename = 0
#image_geometry_filename =/home/rohit/workspace/ros1/2025_humanoids_ws/src/gpd/cfg/image_geometry_15channels.cfg

# ==== Robot Hand Geometry ====
#   finger_width: the width of the finger
#   outer_diameter: the diameter of the robot hand (= maximum aperture + 2 * finger width)
#   hand_depth: the finger length (measured from hand base to finger tip)
#   hand_height: HALF the hand height (GPD crops from -height to +height)
#   init_bite: the minimum amount of the object to be covered by the hand
finger_width          = 0.012          # Robotiq 2F-85 pad slab thickness (measured from inner_finger mesh: 11.8 mm)
hand_outer_diameter   = 0.102          # max aperture (0.0785 @ finger_joint=0) + 2 * finger_width
hand_depth            = 0.037          # usable pad length along approach (pad spans z = 7..44 mm on the inner finger)
hand_height           = 0.011          # 22 mm pad width / 2; GPD expects a half-extent
init_bite             = 0.010          # min. object depth inside the jaws



# ==== Grasp Descriptor ====
#   volume_width: the width of the cube inside the robot hand
#   volume_depth: the depth of the cube inside the robot hand
#   volume_height: the height of the cube inside the robot hand
#   image_size: the size of the image (width and height; image is square)
#   image_num_channels: the number of image channels
# These are descriptor-window dimensions, not collision geometry. Keep them at
# the geometry used to train the bundled 15-channel network; shrinking them to
# the physical jaw opening changes the image scale seen by the classifier.
volume_width          = 0.10
volume_depth          = 0.06
volume_height         = 0.02           # half-extent: descriptor spans 40 mm
image_size            = 60
image_num_channels    = 15

# (OpenVINO) Path to directory that contains neural network parameters
# weights_file = /home/andreas/projects/gpd/lenet/15channels/params/
weights_file = /opt/gpd/models/lenet/15channels/params/
model_file = /opt/gpd/models/caffe/15channels/single_view_15_channels.caffemodel

# Preprocessing of point cloud
#   voxelize: if the cloud gets voxelized/downsampled
#   remove_outliers: if statistical outliers are removed from the cloud (used to remove noise)
#   workspace: the workspace of the robot (dimensions of a cube centered at origin of point cloud)
#   camera_position: the position of the camera from which the cloud was taken
#   sample_above_plane: only draws samples which do not belong to the table plane
voxelize              = 1
voxel_size             = 0.003         # preserve small food edges and match GPD training resolution
remove_outliers       = 0              # unsafe for multi-view bookkeeping in this GPD fork
workspace             = -2 2 -2 2 -2 2   # tighten to your map crop
camera_position       = 0 0 0                         # ok when clouds are in map frame
sample_above_plane    = 0                             # set 1 only if you pass raw table points;
                                                      # 1 makes GPD discard the CloudIndexed indices
normals_radius        = 0.015         # avoid blending adjacent food faces with the support plane
refine_normals_k      = 0


# Grasp candidate generation
#   num_samples: the number of samples to be drawn from the point cloud
#   num_threads: the number of CPU threads to be used
#   nn_radius: the radius for the neighborhood search
#   num_orientations: the number of robot hand orientations to evaluate
#   hand_axes: local-frame axes used to generate approach families
#              (0: normal/approach, 1: binormal, 2: curvature axis)
num_samples           = 150           # sampled only from caller-provided food points
num_threads           = 5
nn_radius             = 0.02          # 2 cm neighborhood; raise to 0.03 for sparser clouds
num_orientations      = 8             # eight rotations on each enabled axis (24 total per sample)
# Use an odd grid so GPD has an actual centered placement.  With an even grid,
# chooseMiddleHand() must choose one of the two off-centre placements, which
# biases one finger toward the object and leaves excess clearance at the other.
num_finger_placements = 9
hand_axes             = 0 1 2         # generate normal, binormal, and curvature-axis approach families
# deepenHand() pushes the hand from init_bite up to hand_depth (37 mm) onto
# the object whenever a deeper placement is still collision-free, burying the
# fingers deep into soft food. Disable it so grasps stay at the shallow
# init_bite depth instead.
deepen_hand           = 0
friction_coeff        = 20.0
min_viable            = 6

# Filtering of candidates
#   min_aperture: the minimum gripper width
#   max_aperture: the maximum gripper width
#   workspace_grasps: dimensions of a cube centered at origin of point cloud; should be smaller than <workspace>
min_aperture          = 0.010         # avoid "pinch on nothing"
max_aperture          = 0.085         # 2F-85 opens to 78.5 mm in this URDF; 3.5 mm margin
# NOTE: this box is applied in the frame of the cloud that is sent to the
# service, which is 'left_camera_frame' (camera optical: +x right, +y down,
# +z forward) -- NOT the world/base frame. Re-derive these numbers if the
# merge target frame in grasp_pose_provider changes.
#
# Measured by rendering the three left cameras with the robot parked broadside
# to the parking-1 shelf (base_link at x 1.9, y -7.0, yaw -90 deg). The merged
# cloud spans x -0.65..0.65, y -0.26..0.30, z 0.30..0.73 there. The x span is
# set by the flanking cameras, which now cross at 30 deg instead of 15 deg and
# so reach ~0.15 m further out to each side than the old front trio did. The
# y/z spans slide with the standoff distance, so the box is widened to cover
# the whole +-0.15 m nav goal tolerance (y -0.30..0.44, z 0.27..0.82 over that
# window) plus the same ~0.05 m margin the front-camera box used.
workspace_grasps      = -0.70 0.70 -0.35 0.50 0.22 0.87

# Filtering of candidates based on their approach direction
#   filter_approach_direction: turn filtering on/off
#   direction: the direction to compare against
#   angle_thresh: angle in radians above which grasps are filtered
filter_approach_direction = 1
# At the shelf parking poses (map yaw = -90 deg), map +X toward the shelf is
# base_link +Y.  The centre camera is pitched 30 deg down, so base_link +Y is
# this unit vector in the merged left_camera_frame.
direction = 0 -0.5 0.8660254037844386
# GPD's CFG filter supports one cone: retain approaches no more than 110 deg
# from map +X toward the shelf.  The complementary 20 deg minimum (which
# rejects floor-parallel +X approaches) is enforced after conversion to
# base_link by grasp_pose_ranking.
thresh_rad = 1.9198621771937625       # 110 degrees

# Clustering of grasps
#   min_inliers: minimum number of inliers per cluster; set to 0 to turn off clustering
min_inliers = 1                       # collapse near-duplicate poses so top-ranked grasps span distinct geometries

# Grasp selection
#   num_selected: number of selected grasps (sorted by score)
num_selected = 20                     # retain a broad ranked set after geometric clustering

# Visualization
#   plot_normals: plot the surface normals
#   plot_samples: plot the samples
#   plot_candidates: plot the grasp candidates
#   plot_filtered_candidates: plot the grasp candidates which remain after filtering
#   plot_valid_grasps: plot the candidates that are identified as valid grasps
#   plot_clustered_grasps: plot the grasps that after clustering
#   plot_selected_grasps: plot the selected grasps (final output)
plot_normals = 0
plot_samples = 0
plot_candidates = 0
plot_filtered_candidates = 0
plot_valid_grasps = 0
plot_clustered_grasps = 0
plot_selected_grasps = 0
